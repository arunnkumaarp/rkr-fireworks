services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rkr
      POSTGRES_USER: rkr
      POSTGRES_PASSWORD: rkr
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rkr"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
